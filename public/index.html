<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050B18">
<title>Aquabike Evolution Dakar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#050B18;--bg2:#0A1628;--bg3:#0F1D32;--card:#111F38;--border:#1A2D4D;--accent:#00D4AA;--accent2:#00B4D8;--accentDim:rgba(0,212,170,.1);--danger:#FF5757;--dangerDim:rgba(255,87,87,.1);--warn:#FFB830;--warnDim:rgba(255,184,48,.1);--text:#EDF2F7;--muted:#8899B0;--dim:#4A5B73;--glass:rgba(15,29,50,.75)}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Outfit',sans-serif;font-weight:700;line-height:1.2}
button{font-family:inherit;cursor:pointer;border:none;outline:none;-webkit-appearance:none}
input,select{font-family:inherit;outline:none;-webkit-appearance:none}
a{color:var(--accent);text-decoration:none}

#root{height:100%;display:flex;flex-direction:column}
.app{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 100px;-webkit-overflow-scrolling:touch}
.page::-webkit-scrollbar{display:none}

/* Header */
.hdr{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-weight:800;font-size:16px;color:#000}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:-.3px}
.hdr p{font-size:10px;color:var(--muted);font-weight:500}
.hdr-user{font-size:12px;color:var(--muted);text-align:right}
.hdr-user b{color:var(--text);display:block;font-size:13px}

/* Bottom Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:none;color:var(--dim);font-size:10px;font-weight:600;border-radius:10px;transition:all .2s}
.bnav button.active{color:var(--accent)}
.bnav button .icon{font-size:20px;line-height:1}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card-glass{background:var(--glass);backdrop-filter:blur(12px);border:1px solid rgba(0,212,170,.15);border-radius:16px;padding:16px;margin-bottom:12px}

/* Buttons */
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;text-align:center;transition:all .15s;letter-spacing:.3px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#00B89C);color:#000;box-shadow:0 4px 20px rgba(0,212,170,.25)}
.btn-primary:active{transform:scale(.97)}
.btn-danger{background:var(--dangerDim);color:var(--danger);border:1px solid rgba(255,87,87,.2)}
.btn-outline{background:transparent;color:var(--accent);border:1px solid rgba(0,212,170,.3)}
.btn-wave{background:linear-gradient(135deg,#1DC3F5,#1BA0D8);color:#fff}
.btn-om{background:linear-gradient(135deg,#FF6B00,#E55D00);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px;width:auto;display:inline-block;border-radius:8px}
.btn:disabled{opacity:.4;pointer-events:none}

/* Forms */
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.5px}
.input-group input,.input-group select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:15px}
.input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentDim)}

/* Slot Grid */
.slots-grid{display:grid;grid-template-columns:52px repeat(auto-fill,minmax(68px,1fr));gap:3px}
.slot-hour{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--dim);font-family:'Outfit'}
.slot{border-radius:10px;padding:8px 4px;text-align:center;transition:all .15s;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid transparent}
.slot:active:not(.past){transform:scale(.95)}
.slot .cnt{font-size:14px;font-weight:700;font-family:'Outfit'}.slot .lbl{font-size:9px;font-weight:600;opacity:.85;margin-top:1px}
.slot.avail{background:rgba(0,212,170,.08);color:var(--accent);border-color:rgba(0,212,170,.2)}
.slot.limited{background:var(--warnDim);color:var(--warn);border-color:rgba(255,184,48,.2)}
.slot.full{background:var(--dangerDim);color:var(--danger);border-color:rgba(255,87,87,.15);cursor:not-allowed;opacity:.6}
.slot.mine{background:var(--accentDim);color:var(--accent);border-color:var(--accent)}
.slot.past{background:rgba(10,22,40,.5);color:var(--dim);cursor:not-allowed;opacity:.3}
.slot.flash{animation:flash .5s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(0,212,170,.4)}50%{box-shadow:0 0 0 6px rgba(0,212,170,.08)}100%{box-shadow:none}}

/* Day Headers */
.day-head{text-align:center;padding:4px 0;border-radius:8px}
.day-head.today{background:rgba(0,180,216,.1)}
.day-head .dow{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1px}
.day-head .dn{font-size:17px;font-weight:800;font-family:'Outfit'}
.day-head.today .dn{color:var(--accent2)}

/* Week nav */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.week-nav button{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600}
.week-nav button:active{background:var(--card)}
.week-label{font-size:14px;font-weight:700;font-family:'Outfit'}

/* Activity tabs */
.act-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.act-tabs::-webkit-scrollbar{display:none}
.act-tab{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg3);color:var(--muted);border:1px solid var(--border);transition:all .2s;flex-shrink:0}
.act-tab.active{background:var(--accentDim);color:var(--accent);border-color:rgba(0,212,170,.3)}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--bg2);border-top-left-radius:24px;border-top-right-radius:24px;padding:24px 20px 36px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--dim);margin:0 auto 16px}

/* Plan cards */
.plan{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;transition:all .2s}
.plan:active{transform:scale(.98)}
.plan.selected{border-color:var(--accent);background:rgba(0,212,170,.05)}
.plan-price{font-size:22px;font-weight:800;font-family:'Outfit';color:var(--accent)}
.plan-price span{font-size:12px;font-weight:500;color:var(--muted)}
.plan-name{font-size:15px;font-weight:700;margin-top:4px}
.plan-desc{font-size:12px;color:var(--muted);margin-top:2px}
.plan-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;margin-top:6px}

/* Booking row */
.brow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin-bottom:8px}
.brow.cancelled{opacity:.4}
.brow-info{flex:1}
.brow-info h4{font-size:14px;font-weight:700;font-family:'Outfit'}
.brow-info p{font-size:12px;color:var(--muted);margin-top:2px}
.brow-code{font-family:'Outfit';font-size:11px;color:var(--accent2);background:rgba(0,180,216,.1);padding:3px 8px;border-radius:6px;margin-top:4px;display:inline-block}

/* Sub card */
.sub-card{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin-bottom:8px}
.sub-card .status{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700}
.sub-card .status.active{background:rgba(0,212,170,.15);color:var(--accent)}
.sub-card .status.pending{background:var(--warnDim);color:var(--warn)}
.sub-card .status.expired{background:var(--dangerDim);color:var(--danger)}
.sub-counter{display:flex;gap:4px;margin-top:8px}
.sub-dot{width:20px;height:6px;border-radius:3px;background:var(--border)}
.sub-dot.used{background:var(--accent)}

/* Toast */
.toast{position:fixed;top:16px;left:16px;right:16px;z-index:100;padding:14px 16px;border-radius:14px;font-size:13px;font-weight:600;text-align:center;animation:fadeDown .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast-ok{background:rgba(0,212,170,.15);color:var(--accent);border:1px solid rgba(0,212,170,.3)}
.toast-err{background:var(--dangerDim);color:var(--danger);border:1px solid rgba(255,87,87,.3)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

.empty-state{text-align:center;padding:40px 20px;color:var(--dim)}
.empty-state .em{font-size:40px;margin-bottom:10px}

@media(min-width:600px){.page{max-width:480px;margin:0 auto}.bnav{max-width:480px;margin:0 auto;border-radius:16px 16px 0 0}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useCallback,useMemo,useRef}=React;
const DAYS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MONTHS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const MONTHS_FULL=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const fmtDate=d=>`${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtPrice=n=>n.toLocaleString('fr-FR')+'F';

const api={
  token:null,
  async get(u){const r=await fetch(u,{headers:this.token?{Authorization:'Bearer '+this.token}:{}});return r.json()},
  async post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json',...(this.token?{Authorization:'Bearer '+this.token}:{})},body:JSON.stringify(b)});return r.json()}
};

function getWeekDays(off){const n=new Date();n.setDate(n.getDate()+off*7);const d=n.getDay();const m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1));const a=[];for(let i=0;i<7;i++){const x=new Date(m);x.setDate(m.getDate()+i);a.push(x)}return a}

function Toast({msg,type,onDone}){useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t)},[]);return<div className={`toast toast-${type==='success'?'ok':'err'}`}>{msg}</div>}

// ─── AUTH ───────────────────────────────────────────────
function AuthScreen({onAuth}){
  const[mode,setMode]=useState('login');
  const[phone,setPhone]=useState('');
  const[pin,setPin]=useState('');
  const[name,setName]=useState('');
  const[email,setEmail]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    setErr('');setLoading(true);
    const r=mode==='login'?await api.post('/api/login',{phone,pin}):await api.post('/api/register',{full_name:name,phone,pin,email});
    setLoading(false);
    if(r.ok){api.token=r.token;localStorage.setItem('aq_token',r.token);localStorage.setItem('aq_user',JSON.stringify(r.user));onAuth(r.user,r.token)}
    else setErr(r.error||'Erreur');
  };

  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',padding:'40px 24px',background:'linear-gradient(160deg,#050B18 0%,#0A1628 40%,#0D2137 100%)'}}>
      <div style={{textAlign:'center',marginBottom:32}}>
        <div style={{width:56,height:56,borderRadius:16,background:'linear-gradient(135deg,#00D4AA,#00B4D8)',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:24,fontWeight:800,color:'#000',fontFamily:'Outfit',marginBottom:12}}>A</div>
        <h1 style={{fontSize:24,fontFamily:'Outfit'}}>Aquabike Evolution</h1>
        <p style={{color:'var(--muted)',fontSize:13,marginTop:4}}>Dakar — Réservation en ligne</p>
      </div>

      <div className="card">
        <div style={{display:'flex',gap:4,marginBottom:16}}>
          <button onClick={()=>setMode('login')} className={`btn-sm ${mode==='login'?'btn-primary':'btn-outline'}`} style={{flex:1}}>Connexion</button>
          <button onClick={()=>setMode('register')} className={`btn-sm ${mode==='register'?'btn-primary':'btn-outline'}`} style={{flex:1}}>Inscription</button>
        </div>

        {mode==='register'&&<><div className="input-group"><label>NOM COMPLET</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Fatou Diallo"/></div>
        <div className="input-group"><label>EMAIL (optionnel)</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="fatou@email.com"/></div></>}

        <div className="input-group"><label>TELEPHONE</label><input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="77 123 45 67"/></div>
        <div className="input-group"><label>MOT DE PASSE</label><input type="password" value={pin} onChange={e=>setPin(e.target.value)} placeholder="Votre mot de passe"/></div>

        {err&&<p style={{color:'var(--danger)',fontSize:13,marginBottom:12,textAlign:'center'}}>{err}</p>}
        <button className="btn btn-primary" onClick={submit} disabled={loading}>{loading?'Chargement...':mode==='login'?'Se connecter':'Créer mon compte'}</button>
      </div>
    </div>
  );
}

// ─── BOOKING MODAL ──────────────────────────────────────
function BookingModal({slot,onClose,onBook}){
  const[loading,setLoading]=useState(false);
  const remaining=parseInt(slot.remaining);
  const d=new Date(slot.date_slot+'T00:00:00');
  const handleBook=async()=>{setLoading(true);await onBook(slot.id);setLoading(false)};
  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-handle"/>
        <p style={{fontSize:11,fontWeight:600,color:'var(--muted)',letterSpacing:1}}>{slot.activity?.toUpperCase()}</p>
        <h2 style={{fontSize:20,marginTop:2,marginBottom:12,fontFamily:'Outfit'}}>{fmtDate(d)} — {slot.hour_start}h00</h2>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--muted)',marginBottom:4}}>
          <span>Capacité</span>
          <span style={{fontWeight:700,color:remaining<=0?'var(--danger)':remaining<=3?'var(--warn)':'var(--accent)'}}>{remaining}/{slot.max_capacity} places</span>
        </div>
        <div style={{height:5,borderRadius:3,background:'var(--bg)',overflow:'hidden',marginBottom:16}}>
          <div style={{height:'100%',borderRadius:3,width:`${(parseInt(slot.booked||0)/slot.max_capacity)*100}%`,background:remaining<=2?'var(--danger)':remaining<=4?'var(--warn)':'var(--accent)',transition:'width .3s'}}/>
        </div>
        {remaining<=0?<div className="btn" style={{background:'var(--dangerDim)',color:'var(--danger)'}}>Créneau complet</div>
        :<button className="btn btn-primary" onClick={handleBook} disabled={loading}>{loading?'Réservation...':'Réserver cette séance'}</button>}
        <p style={{fontSize:11,color:'var(--dim)',textAlign:'center',marginTop:10}}>Annulation possible jusqu'à 2h avant</p>
      </div>
    </div>);
}

// ─── CALENDAR ───────────────────────────────────────────
function CalendarView({slots,onBook,myBookings}){
  const[weekOff,setWeekOff]=useState(0);
  const[activity,setActivity]=useState('Aquabike');
  const[modal,setModal]=useState(null);

  const days=useMemo(()=>getWeekDays(weekOff),[weekOff]);
  const activities=['Aquabike','Aquagym','Rééducation','Natation'];
  const todayStr=new Date().toISOString().split('T')[0];

  const isReedNat=(activity==='Rééducation'||activity==='Natation');
  const hours=useMemo(()=>{
    if(isReedNat) return [13,14,15,16];
    return [8,9,10,11,12,17,18,19];
  },[isReedNat]);

  const slotMap=useMemo(()=>{const m={};(slots||[]).filter(s=>s.activity===activity).forEach(s=>{m[`${s.date_slot}_${s.hour_start}`]=s});return m},[slots,activity]);
  const mySet=useMemo(()=>new Set((myBookings||[]).filter(b=>b.status===1).map(b=>b.slot_id)),[myBookings]);

  const monthLabel=MONTHS_FULL[days[0].getMonth()].toUpperCase()+' '+days[0].getFullYear();

  const handleBook=async(slotId)=>{const ok=await onBook(slotId);if(ok)setModal(null)};

  return(<div>
    <div className="act-tabs">
      {activities.map(a=><button key={a} className={`act-tab${activity===a?' active':''}`} onClick={()=>setActivity(a)}>{a==='Rééducation'?'Rééduc.':a}</button>)}
    </div>

    <div className="week-nav">
      <button onClick={()=>setWeekOff(w=>w-1)}>&#8249; Préc.</button>
      <span className="week-label">{monthLabel}</span>
      <button onClick={()=>setWeekOff(w=>w+1)}>Suiv. &#8250;</button>
    </div>

    <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch',paddingBottom:4}}>
      <div className="slots-grid" style={{minWidth:isReedNat?420:560}}>
        <div/>
        {days.map((d,i)=>{const iso=d.toISOString().split('T')[0];const isToday=iso===todayStr;
          return <div key={i} className={`day-head${isToday?' today':''}`}><div className="dow">{DAYS[d.getDay()]}</div><div className="dn">{d.getDate()}</div></div>})}

        {hours.map(h=>{
          const isWeekendHour=(!isReedNat&&h>=17);
          return <React.Fragment key={h}>
            <div className="slot-hour">{String(h).padStart(2,'0')}h</div>
            {days.map((d,i)=>{
              const dateStr=d.toISOString().split('T')[0];
              const dow=d.getDay();
              const isWeekend=(dow===0||dow===6);
              // Check if this hour exists for this day
              let validHour=true;
              if(!isReedNat){
                if(isWeekend&&(h<10||h>12)) validHour=false;
                if(!isWeekend&&h>=13&&h<17) validHour=false;
              }
              const k=`${dateStr}_${h}`;
              const s=slotMap[k];
              const now=new Date();
              const slotTime=new Date(`${dateStr}T${String(h).padStart(2,'0')}:00:00`);
              const isPast=slotTime<now;

              if(!validHour||!s) return <div key={k} className="slot past"><span className="cnt" style={{fontSize:11}}>—</span></div>;

              const rem=parseInt(s.remaining);
              const isMine=mySet.has(s.id);
              let cls='slot ';
              if(isPast)cls+='past';else if(isMine)cls+='mine';else if(rem<=0)cls+='full';else if(rem<=3)cls+='limited';else cls+='avail';

              return <div key={k} className={cls} onClick={()=>!isPast&&rem>0&&!isMine&&setModal(s)}>
                <span className="cnt">{isPast?'—':isMine?'✓':rem<=0?'✕':`${rem}`}</span>
                <span className="lbl">{isPast?'':isMine?'Réservé':rem<=0?'Complet':rem<=3?'Dépêchez':''}</span>
              </div>
            })}
          </React.Fragment>})}
      </div>
    </div>

    {modal&&<BookingModal slot={slotMap[`${modal.date_slot}_${modal.hour_start}`]||modal} onClose={()=>setModal(null)} onBook={handleBook}/>}
  </div>);
}

// ─── PLANS / SUBSCRIBE ──────────────────────────────────
function PlansView({plans,onSubscribe,toast}){
  const[sel,setSel]=useState(null);
  const[payModal,setPayModal]=useState(false);
  const[loading,setLoading]=useState(false);

  const subscribe=async(method)=>{
    if(!sel)return;setLoading(true);
    const r=await api.post('/api/subscribe',{plan_id:sel.id,payment_method:method});
    setLoading(false);
    if(r.ok){
      if(r.payment_url){window.open(r.payment_url,'_blank')}
      toast(method==='cash'?'Abonnement en attente de validation.':'Abonnement activé ! Ref: '+r.payment_ref,'success');
      setPayModal(false);setSel(null);onSubscribe();
    } else toast(r.error||'Erreur','error');
  };

  return(<div>
    <h2 style={{fontSize:18,marginBottom:4}}>Nos abonnements</h2>
    <p style={{fontSize:12,color:'var(--muted)',marginBottom:16}}>Choisissez votre formule puis payez par Wave ou Orange Money</p>

    {plans.map(p=><div key={p.id} className={`plan${sel?.id===p.id?' selected':''}`} onClick={()=>{setSel(p);setPayModal(true)}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><div className="plan-name">{p.name}</div><div className="plan-desc">{p.desc}</div></div>
        <div className="plan-price">{fmtPrice(p.price)}</div>
      </div>
      <span className="plan-badge" style={{
        background:p.limit_type==='weekly'?'rgba(0,180,216,.1)':'rgba(255,184,48,.1)',
        color:p.limit_type==='weekly'?'var(--accent2)':'var(--warn)'
      }}>{p.limit_type==='weekly'?`${p.limit_value}x/semaine`:`${p.limit_value} séances`} — {p.duration_days}j</span>
    </div>)}

    {payModal&&sel&&<div className="modal-bg" onClick={()=>setPayModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-handle"/>
        <h2 style={{fontSize:18,fontFamily:'Outfit',marginBottom:4}}>{sel.name}</h2>
        <p style={{color:'var(--muted)',fontSize:13,marginBottom:4}}>{sel.desc}</p>
        <p className="plan-price" style={{marginBottom:16}}>{fmtPrice(sel.price)}</p>

        <p style={{fontSize:12,fontWeight:600,color:'var(--muted)',marginBottom:10,letterSpacing:.5}}>CHOISIR LE MODE DE PAIEMENT</p>
        <button className="btn btn-wave" onClick={()=>subscribe('wave')} disabled={loading} style={{marginBottom:8}}>Payer avec Wave</button>
        <button className="btn btn-om" onClick={()=>subscribe('orange_money')} disabled={loading} style={{marginBottom:8}}>Payer avec Orange Money</button>
        <button className="btn btn-outline" onClick={()=>subscribe('cash')} disabled={loading}>Payer en espèces (sur place)</button>
        <p style={{fontSize:11,color:'var(--dim)',textAlign:'center',marginTop:10}}>Le paiement en espèces nécessite une validation par l'admin</p>
      </div>
    </div>}
  </div>);
}

// ─── MY BOOKINGS ────────────────────────────────────────
function BookingsView({bookings,subscriptions,onCancel,toast}){
  const now=new Date();
  const activeBookings=(bookings||[]).filter(b=>b.status===1);
  const pastBookings=(bookings||[]).filter(b=>b.status!==1);
  const activeSubs=(subscriptions||[]).filter(s=>s.status==='active');

  const handleCancel=async(id)=>{
    if(!confirm('Annuler cette réservation ?'))return;
    const r=await api.post('/api/cancel',{booking_id:id});
    if(r.ok){toast('Réservation annulée.','success');onCancel()}
    else toast(r.error||'Erreur','error');
  };

  return(<div>
    {activeSubs.length>0&&<>
      <h3 style={{fontSize:14,fontWeight:600,color:'var(--muted)',marginBottom:8,letterSpacing:.5}}>MES ABONNEMENTS ACTIFS</h3>
      {activeSubs.map(s=><div key={s.id} className="sub-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><b style={{fontSize:14}}>{s.plan_name}</b><br/><span style={{fontSize:12,color:'var(--muted)'}}>Expire le {new Date(s.expires_at).toLocaleDateString('fr-FR')}</span></div>
          <span className={`status ${s.status}`}>{s.status==='active'?'Actif':s.status==='pending'?'En attente':'Expiré'}</span>
        </div>
        <div className="sub-counter">
          {Array.from({length:s.limit_value}).map((_,i)=><div key={i} className={`sub-dot${i<s.sessions_used?' used':''}`}/>)}
        </div>
        <p style={{fontSize:11,color:'var(--muted)',marginTop:4}}>{s.sessions_used}/{s.limit_value} séances utilisées</p>
      </div>)}
    </>}

    <h3 style={{fontSize:14,fontWeight:600,color:'var(--muted)',marginTop:16,marginBottom:8,letterSpacing:.5}}>MES RÉSERVATIONS</h3>
    {activeBookings.length===0&&pastBookings.length===0&&<div className="empty-state"><div className="em">📅</div>Aucune réservation<br/><span style={{fontSize:12}}>Réservez depuis le calendrier</span></div>}

    {activeBookings.map(b=>{
      const d=new Date(b.date_slot+'T00:00:00');
      const slotTime=new Date(`${b.date_slot}T${String(b.hour_start).padStart(2,'0')}:00:00`);
      const isPast=slotTime<now;
      const canCancel=!isPast&&(slotTime-now)>=2*3600000;
      return<div key={b.id} className="brow">
        <div style={{width:44,height:44,borderRadius:12,background:'var(--accentDim)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>🏊</div>
        <div className="brow-info">
          <h4>{fmtDate(d)} — {b.hour_start}h</h4>
          <p>{b.activity}</p>
          <span className="brow-code">{b.booking_code}</span>
        </div>
        {canCancel&&<button className="btn-sm btn-danger" onClick={()=>handleCancel(b.id)}>Annuler</button>}
      </div>})}

    {pastBookings.map(b=>{
      const d=new Date(b.date_slot+'T00:00:00');
      return<div key={b.id} className="brow cancelled">
        <div style={{width:44,height:44,borderRadius:12,background:'var(--dangerDim)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>{b.status===0?'✕':'✓'}</div>
        <div className="brow-info"><h4>{fmtDate(d)} — {b.hour_start}h</h4><p>{b.activity} — {b.status===0?'Annulée':'Passée'}</p></div>
      </div>})}
  </div>);
}

// ─── ADMIN ──────────────────────────────────────────────
function AdminView({user,toast}){
  const[start,setStart]=useState(new Date().toISOString().split('T')[0]);
  const[end,setEnd]=useState(new Date(Date.now()+30*86400000).toISOString().split('T')[0]);
  const[loading,setLoading]=useState(false);

  const generate=async()=>{
    setLoading(true);
    const r=await api.post('/api/admin/generate-slots',{date_start:start,date_end:end,activities:['Aquabike','Aquagym','Rééducation','Natation']});
    setLoading(false);
    if(r.ok) toast(`${r.created} créneaux générés !`,'success');
    else toast(r.error||'Erreur','error');
  };

  if(user.role!=='admin') return <div className="card" style={{textAlign:'center',padding:24}}>
    <p style={{color:'var(--muted)',marginBottom:12}}>Accès réservé aux administrateurs.</p>
    <p style={{fontSize:12,color:'var(--dim)'}}>Contactez Aquabike Evolution pour devenir admin.</p>
  </div>;

  return(<div>
    <h2 style={{fontSize:18,marginBottom:12}}>Administration</h2>
    <div className="card">
      <h3 style={{fontSize:14,marginBottom:12}}>Générer les créneaux</h3>
      <div className="input-group"><label>DATE DEBUT</label><input type="date" value={start} onChange={e=>setStart(e.target.value)}/></div>
      <div className="input-group"><label>DATE FIN</label><input type="date" value={end} onChange={e=>setEnd(e.target.value)}/></div>
      <p style={{fontSize:12,color:'var(--muted)',marginBottom:12}}>Génère automatiquement tous les créneaux pour Aquabike, Aquagym, Rééducation et Natation selon les horaires configurés.</p>
      <button className="btn btn-primary" onClick={generate} disabled={loading}>{loading?'Génération...':'Générer les créneaux'}</button>
    </div>
  </div>);
}

// ─── APP ────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[view,setView]=useState('calendar');
  const[slots,setSlots]=useState([]);
  const[plans,setPlans]=useState([]);
  const[bookings,setBookings]=useState([]);
  const[subs,setSubs]=useState([]);
  const[toastData,setToastData]=useState(null);

  const toast=(msg,type)=>setToastData({msg,type,key:Date.now()});

  // Auto login
  useEffect(()=>{
    const t=localStorage.getItem('aq_token');
    const u=localStorage.getItem('aq_user');
    if(t&&u){api.token=t;setUser(JSON.parse(u))}
  },[]);

  // Load data
  const fetchSlots=useCallback(async()=>{
    const days=getWeekDays(0);
    // Fetch 2 weeks
    const s=new Date();s.setDate(s.getDate()-7);
    const e=new Date();e.setDate(e.getDate()+14);
    const r=await api.get(`/api/slots?start=${s.toISOString().split('T')[0]}&end=${e.toISOString().split('T')[0]}`);
    if(r.ok)setSlots(r.slots);
  },[]);

  const fetchBookings=useCallback(async()=>{
    const r=await api.get('/api/my-bookings');
    if(r.ok)setBookings(r.bookings);
  },[]);

  const fetchSubs=useCallback(async()=>{
    const r=await api.get('/api/my-subscriptions');
    if(r.ok)setSubs(r.subscriptions);
  },[]);

  useEffect(()=>{
    if(!user)return;
    api.get('/api/plans').then(r=>{if(r.ok)setPlans(r.plans)});
    fetchSlots();fetchBookings();fetchSubs();
    // SSE
    const es=new EventSource('/api/events');
    es.addEventListener('update',()=>fetchSlots());
    // Polling fallback
    const iv=setInterval(fetchSlots,20000);
    return()=>{es.close();clearInterval(iv)};
  },[user,fetchSlots,fetchBookings,fetchSubs]);

  const handleBook=async(slotId)=>{
    const r=await api.post('/api/book',{slot_id:slotId});
    if(r.ok){toast(`Réservé ! Code: ${r.booking_code}`,'success');fetchSlots();fetchBookings();fetchSubs();return true}
    else{toast(r.error||'Erreur','error');fetchSlots();return false}
  };

  const logout=()=>{localStorage.removeItem('aq_token');localStorage.removeItem('aq_user');api.token=null;setUser(null)};

  if(!user) return <AuthScreen onAuth={(u,t)=>setUser(u)}/>;

  return(<div className="app">
    <div className="hdr">
      <div className="hdr-logo">
        <div className="hdr-icon">A</div>
        <div><h1>Aquabike Evolution</h1><p>Réservation en ligne</p></div>
      </div>
      <div className="hdr-user" onClick={logout} style={{cursor:'pointer'}}>
        <b>{user.full_name?.split(' ')[0]}</b>
        <span style={{fontSize:10}}>Déconnexion</span>
      </div>
    </div>

    <div className="page">
      {view==='calendar'&&<CalendarView slots={slots} onBook={handleBook} myBookings={bookings}/>}
      {view==='plans'&&<PlansView plans={plans} onSubscribe={()=>{fetchSubs();setView('bookings')}} toast={toast}/>}
      {view==='bookings'&&<BookingsView bookings={bookings} subscriptions={subs} onCancel={()=>{fetchBookings();fetchSlots();fetchSubs()}} toast={toast}/>}
      {view==='admin'&&<AdminView user={user} toast={toast}/>}
    </div>

    <div className="bnav">
      <button className={view==='calendar'?'active':''} onClick={()=>setView('calendar')}><span className="icon">📅</span>Calendrier</button>
      <button className={view==='plans'?'active':''} onClick={()=>setView('plans')}><span className="icon">💎</span>Abonnements</button>
      <button className={view==='bookings'?'active':''} onClick={()=>setView('bookings')}><span className="icon">🎫</span>Mes séances</button>
      <button className={view==='admin'?'active':''} onClick={()=>setView('admin')}><span className="icon">⚙️</span>Admin</button>
    </div>

    {toastData&&<Toast key={toastData.key} msg={toastData.msg} type={toastData.type} onDone={()=>setToastData(null)}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
