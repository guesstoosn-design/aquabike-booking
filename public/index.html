<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050B18">
<title>Aquabike Evolution Dakar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#050B18;--bg2:#0A1628;--bg3:#0F1D32;--card:#111F38;--border:#1A2D4D;--accent:#00D4AA;--accent2:#00B4D8;--accentDim:rgba(0,212,170,.1);--danger:#FF5757;--dangerDim:rgba(255,87,87,.1);--warn:#FFB830;--warnDim:rgba(255,184,48,.1);--text:#EDF2F7;--muted:#8899B0;--dim:#4A5B73;--glass:rgba(15,29,50,.85)}
html,body{height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px}
h1,h2,h3{font-family:'Outfit',sans-serif;font-weight:700}button{font-family:inherit;cursor:pointer;border:none;outline:none}input,select{font-family:inherit;outline:none}
#root{height:100%}.app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;overflow-y:auto;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}.page::-webkit-scrollbar{display:none}
.page-enter{animation:pageIn .3s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hdr{padding:10px 14px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
.hdr-logo{display:flex;align-items:center;gap:8px}.hdr-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-weight:800;font-size:15px;color:#000}
.hdr h1{font-size:13px}.hdr p{font-size:9px;color:var(--muted)}
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:2px;padding-bottom:max(2px,env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;background:none;color:var(--dim);font-size:8px;font-weight:600}.bnav button.active{color:var(--accent)}.bnav .icon{font-size:17px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:700;text-align:center}
.btn-primary{background:linear-gradient(135deg,var(--accent),#00B89C);color:#000}.btn-primary:active{transform:scale(.97)}
.btn-danger{background:var(--dangerDim);color:var(--danger);border:1px solid rgba(255,87,87,.2)}
.btn-outline{background:transparent;color:var(--accent);border:1px solid rgba(0,212,170,.25)}
.btn-wave{background:linear-gradient(135deg,#1DC3F5,#1BA0D8);color:#fff}.btn-om{background:linear-gradient(135deg,#FF6B00,#E55D00);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px;width:auto;display:inline-block;border-radius:8px}
.btn-validate{background:var(--accentDim);color:var(--accent);border:1px solid rgba(0,212,170,.25);padding:10px;font-size:13px;font-weight:700;border-radius:10px;width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.input-group{margin-bottom:12px}.input-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.input-group input,.input-group select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px}.input-group input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 12px;border-radius:18px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--bg3);color:var(--muted);border:1px solid var(--border);flex-shrink:0}.tab.on{background:var(--accentDim);color:var(--accent);border-color:rgba(0,212,170,.3)}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.week-nav button{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:7px 10px;border-radius:8px;font-size:11px;font-weight:600}.week-label{font-size:13px;font-weight:700;font-family:'Outfit'}
.cal-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.cal-wrap::-webkit-scrollbar{display:none}.cal{display:grid;gap:3px}
.dh{text-align:center;padding:4px 0;border-radius:6px}.dh.today{background:rgba(0,180,216,.1)}.dh .dow{font-size:9px;font-weight:600;color:var(--muted)}.dh .dn{font-size:16px;font-weight:800;font-family:'Outfit'}.dh.today .dn{color:var(--accent2)}
.sh{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--dim);font-family:'Outfit'}
.sl{border-radius:10px;padding:6px 2px;text-align:center;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid transparent;position:relative;cursor:pointer}
.sl .cn{font-size:15px;font-weight:800;font-family:'Outfit'}.sl .lb{font-size:8px;font-weight:600;opacity:.8;margin-top:1px}
.sl .pb{position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.sl.av{background:rgba(0,212,170,.06);color:var(--accent);border-color:rgba(0,212,170,.12)}.sl.av .pb{background:var(--accent);color:#000}
.sl.lm{background:var(--warnDim);color:var(--warn);border-color:rgba(255,184,48,.12)}.sl.lm .pb{background:var(--warn);color:#000}
.sl.fu{background:var(--dangerDim);color:var(--danger);border-color:rgba(255,87,87,.08)}.sl.fu .pb{background:var(--danger);color:#fff;font-size:10px}
.sl.mi{background:var(--accentDim);color:var(--accent);border-color:var(--accent)}.sl.mi .pb{background:var(--accent);color:#000}
.sl.pa{background:rgba(10,22,40,.5);color:var(--dim);opacity:.3;cursor:default}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg2);border-top-left-radius:22px;border-top-right-radius:22px;padding:20px 18px 32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;animation:sUp .3s cubic-bezier(.22,1,.36,1)}
@keyframes sUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.mh{width:32px;height:4px;border-radius:2px;background:var(--dim);margin:0 auto 14px}
.cpb{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin:6px 0 14px}.cpf{height:100%;border-radius:3px;transition:width .4s}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:6px;animation:rIn .3s ease both}@keyframes rIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.row.x{opacity:.4}.ri{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.rinfo{flex:1}.rinfo h4{font-size:13px;font-weight:700;font-family:'Outfit'}.rinfo p{font-size:11px;color:var(--muted);margin-top:1px}
.rcode{font-family:'Outfit';font-size:10px;color:var(--accent2);background:rgba(0,180,216,.1);padding:2px 7px;border-radius:5px;display:inline-block;margin-top:3px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sc{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);text-align:center;animation:fUp .4s ease both}@keyframes fUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sv{font-size:22px;font-weight:800;font-family:'Outfit'}.slb{font-size:10px;color:var(--muted);margin-top:2px}
.subc{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:6px}
.bg{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}.bg-ok{background:rgba(0,212,170,.12);color:var(--accent)}.bg-pe{background:var(--warnDim);color:var(--warn)}.bg-ex{background:var(--dangerDim);color:var(--danger)}
.sdt{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}.sdd{width:18px;height:5px;border-radius:3px;background:var(--border)}.sdd.u{background:var(--accent)}
.pcard{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--warn);margin-bottom:8px;animation:pW 2s infinite}@keyframes pW{0%,100%{border-color:rgba(255,184,48,.4)}50%{border-color:rgba(255,184,48,.8)}}
.st{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin:16px 0 8px}
.pr{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}.pr:last-child{border:none}
.pa2{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent);margin-right:8px;flex-shrink:0}
.toast{position:fixed;top:14px;left:14px;right:14px;z-index:100;padding:12px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;animation:tIn .3s cubic-bezier(.22,1,.36,1);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-ok{background:rgba(0,212,170,.15);color:var(--accent);border:1px solid rgba(0,212,170,.3)}.toast-err{background:var(--dangerDim);color:var(--danger);border:1px solid rgba(255,87,87,.3)}
@keyframes tIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.emp{text-align:center;padding:32px 16px;color:var(--dim)}.emp .em{font-size:36px;margin-bottom:8px}
.pav{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;font-family:'Outfit';color:#000;margin:0 auto 12px}
.pinf{text-align:center;margin-bottom:16px}.pinf h2{font-size:18px}.pinf p{font-size:12px;color:var(--muted);margin-top:2px}
.ds{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}.ds::-webkit-scrollbar{display:none}
.dp{flex-shrink:0;width:56px;padding:8px 0;border-radius:12px;text-align:center;background:var(--bg3);border:1.5px solid var(--border);cursor:pointer}
.dp.on{background:var(--accentDim);border-color:var(--accent)}.dp .dd{font-size:9px;font-weight:600;color:var(--muted)}.dp .dnum{font-size:20px;font-weight:800;font-family:'Outfit'}.dp.on .dnum{color:var(--accent)}.dp .dm{font-size:8px;color:var(--dim)}
.sr{display:flex;align-items:center;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;animation:rIn .3s ease both}
.sr:active{transform:scale(.97);opacity:.8}
.sr .srt{font-size:22px;font-weight:800;font-family:'Outfit';width:55px;flex-shrink:0}
.sr .sri{flex:1;margin:0 12px}.sr .srp{font-size:13px;font-weight:600}.sr .srb{height:4px;border-radius:2px;background:var(--bg);margin-top:5px;width:100px;overflow:hidden}.sr .srbf{height:100%;border-radius:2px}
.sr .srbt{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.sr.sra .srp{color:var(--accent)}.sr.sra .srbt{background:var(--accent);color:#000}
.sr.srl .srp{color:var(--warn)}.sr.srl .srbt{background:var(--warn);color:#000}
.sr.srf .srp{color:var(--danger)}.sr.srf .srbt{background:var(--dangerDim);color:var(--danger);font-size:14px}
.sr.srm .srp{color:var(--accent)}.sr.srm .srbt{background:var(--accentDim);color:var(--accent)}
.sr.srpa{opacity:.3;pointer-events:none}
.plan{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer}.plan.sel{border-color:var(--accent);background:rgba(0,212,170,.04)}
.plan-price{font-size:20px;font-weight:800;font-family:'Outfit';color:var(--accent)}.plan-name{font-size:14px;font-weight:700;margin-top:3px}.plan-desc{font-size:11px;color:var(--muted);margin-top:2px}
.plan-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-top:4px}
.aslot{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:6px}
.aslot .asl{flex:1}.aslot .asl b{font-size:13px;font-family:'Outfit'}.aslot .asl p{font-size:11px;color:var(--muted);margin-top:2px}
.aslot .abtns{display:flex;gap:6px}
.abtn{padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--bg3);color:var(--muted);cursor:pointer}
.abtn:active{opacity:.7}
.abtn-del{border-color:rgba(255,87,87,.3);color:var(--danger);background:var(--dangerDim)}
@media(min-width:600px){.page{max-width:480px;margin:0 auto}.bnav{max-width:480px;margin:0 auto;border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useCallback,useMemo}=React;
const DY=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],DYF=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'],MO=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const fD=d=>DY[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()].slice(0,3);
const fP=n=>n.toLocaleString('fr-FR')+'F';
const fDt=s=>fD(new Date(s+'T00:00:00'));
const api={token:null,
  get(u){return fetch(u,{headers:this.token?{Authorization:'Bearer '+this.token}:{}}).then(r=>r.json()).catch(()=>({ok:false}))},
  post(u,b){const h={'Content-Type':'application/json'};if(this.token)h.Authorization='Bearer '+this.token;return fetch(u,{method:'POST',headers:h,body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({ok:false}))},
  put(u,b){const h={'Content-Type':'application/json'};if(this.token)h.Authorization='Bearer '+this.token;return fetch(u,{method:'PUT',headers:h,body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({ok:false}))},
  del(u){return fetch(u,{method:'DELETE',headers:this.token?{Authorization:'Bearer '+this.token}:{}}).then(r=>r.json()).catch(()=>({ok:false}))}
};
function gWD(off){const n=new Date();n.setDate(n.getDate()+off*7);const d=n.getDay(),m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1));const a=[];for(let i=0;i<7;i++){const x=new Date(m);x.setDate(m.getDate()+i);a.push(x)}return a}
function Toast({msg,type,onDone}){useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t)},[]);return<div className={'toast toast-'+(type==='success'?'ok':'err')}>{msg}</div>}
function PW({k,children}){return<div className="page-enter" key={k}>{children}</div>}

function AuthScreen({onAuth}){const[mode,setMode]=useState('login'),[phone,setPhone]=useState(''),[pin,setPin]=useState(''),[name,setName]=useState(''),[email,setEmail]=useState(''),[err,setErr]=useState(''),[ld,setLd]=useState(false);
  const go=async()=>{setErr('');setLd(true);const r=mode==='login'?await api.post('/api/login',{phone,pin}):await api.post('/api/register',{full_name:name,phone,pin,email});setLd(false);
    if(r.ok){api.token=r.token;try{localStorage.setItem('aq_token',r.token);localStorage.setItem('aq_user',JSON.stringify(r.user))}catch(e){}onAuth(r.user)}else setErr(r.error||'Erreur')};
  return(<div style={{minHeight:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',padding:'36px 18px',background:'linear-gradient(160deg,#050B18,#0A1628 40%,#0D2137)'}}>
    <div style={{textAlign:'center',marginBottom:24}}><div style={{width:50,height:50,borderRadius:14,background:'linear-gradient(135deg,#00D4AA,#00B4D8)',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:22,fontWeight:800,color:'#000',fontFamily:'Outfit',marginBottom:8}}>A</div>
      <h1 style={{fontSize:20}}>Aquabike Evolution</h1><p style={{color:'var(--muted)',fontSize:12,marginTop:2}}>Dakar — Réservation en ligne</p></div>
    <div className="card"><div style={{display:'flex',gap:4,marginBottom:12}}>
      <button onPointerUp={()=>setMode('login')} className={'btn-sm '+(mode==='login'?'btn-primary':'btn-outline')} style={{flex:1}}>Connexion</button>
      <button onPointerUp={()=>setMode('register')} className={'btn-sm '+(mode==='register'?'btn-primary':'btn-outline')} style={{flex:1}}>Inscription</button></div>
      {mode==='register'&&<><div className="input-group"><label>NOM COMPLET</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Fatou Diallo"/></div><div className="input-group"><label>EMAIL (optionnel)</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="fatou@email.com"/></div></>}
      <div className="input-group"><label>TÉLÉPHONE</label><input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="77 123 45 67"/></div>
      <div className="input-group"><label>MOT DE PASSE</label><input type="password" value={pin} onChange={e=>setPin(e.target.value)} placeholder="Votre mot de passe" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
      {err&&<p style={{color:'var(--danger)',fontSize:12,marginBottom:8,textAlign:'center'}}>{err}</p>}
      <button className="btn btn-primary" onPointerUp={go} disabled={ld}>{ld?'Chargement...':mode==='login'?'Se connecter':'Créer mon compte'}</button></div></div>);
}

function SlotModal({slot,myBookings,onClose,onBook,onCancel,isAdmin}){
  const[ld,setLd]=useState(false),[parts,setParts]=useState(null);
  const rem=parseInt(slot.remaining),bk=parseInt(slot.booked||0),d=new Date(slot.date_slot+'T00:00:00');
  const myB=(myBookings||[]).find(b=>b.status===1&&b.date_slot===slot.date_slot&&String(b.hour_start)===String(slot.hour_start)&&b.activity===slot.activity);
  useEffect(()=>{api.get('/api/slot/'+slot.id+'/participants').then(r=>{if(r.ok)setParts(r.participants)})},[slot.id]);
  const st=new Date(slot.date_slot+'T'+String(slot.hour_start).padStart(2,'0')+':00:00'),isPast=st<new Date(),canC=myB&&!isPast&&(st-new Date())>=7200000;
  const conf=parts?parts.filter(p=>p.status===1):[];
  return(<div className="modal-bg" onPointerUp={e=>{if(e.target===e.currentTarget)onClose()}}><div className="modal">
    <div className="mh"/>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}><div style={{width:44,height:44,borderRadius:12,background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>🏊</div>
      <div><p style={{fontSize:10,fontWeight:600,color:'var(--muted)',letterSpacing:1}}>{slot.activity}</p><h2 style={{fontSize:17,fontFamily:'Outfit'}}>{fD(d)} — {slot.hour_start}h00</h2></div></div>
    <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--muted)',marginBottom:4}}><span>Places</span><span style={{fontWeight:700,color:rem<=0?'var(--danger)':rem<=3?'var(--warn)':'var(--accent)'}}>{rem} / {slot.max_capacity}</span></div>
    <div className="cpb"><div className="cpf" style={{width:(bk/slot.max_capacity*100)+'%',background:rem<=2?'var(--danger)':rem<=4?'var(--warn)':'var(--accent)'}}/></div>
    {conf.length>0&&<div style={{marginBottom:14}}><p style={{fontSize:11,fontWeight:600,color:'var(--muted)',marginBottom:6}}>PARTICIPANTS ({conf.length})</p>
      {conf.map((p,i)=><div key={p.id} className="pr" style={{animationDelay:i*50+'ms'}}><div style={{display:'flex',alignItems:'center'}}><div className="pa2">{p.full_name[0]}</div><b style={{fontSize:13}}>{p.full_name}</b>{isAdmin&&<span style={{fontSize:11,color:'var(--dim)',marginLeft:6}}>{p.phone}</span>}</div>{isAdmin&&<span className="rcode">{p.booking_code}</span>}</div>)}</div>}
    {isPast?<div className="btn" style={{background:'var(--bg3)',color:'var(--dim)'}}>Créneau passé</div>
    :myB?<><div style={{background:'var(--accentDim)',border:'1px solid rgba(0,212,170,.2)',borderRadius:12,padding:12,textAlign:'center',marginBottom:10}}><span style={{color:'var(--accent)',fontWeight:700}}>✓ Inscrit(e) — Code : {myB.booking_code}</span></div>

      </div>)}
    </div>}
    {tab==='gen'&&<div className="card"><h3 style={{fontSize:14,marginBottom:10}}>Générer des créneaux</h3>
      <div className="input-group"><label>DÉBUT</label><input type="date" value={gs} onChange={e=>setGs(e.target.value)}/></div>
      <div className="input-group"><label>FIN</label><input type="date" value={ge} onChange={e=>setGe(e.target.value)}/></div>
      <p style={{fontSize:11,color:'var(--muted)',marginBottom:10}}>Génère automatiquement tous les créneaux (Aquabike, Aquagym, Rééduc., Natation) selon les horaires configurés.</p>
      <button className="btn btn-primary" onPointerUp={gen} disabled={ld}>{ld?'Génération...':'Générer les créneaux'}</button></div>}
    </PW></div>);
}

function App(){const[user,setUser]=useState(null),[view,setView]=useState('reserve'),[vk,setVk]=useState(0);
  const[slots,setSlots]=useState([]),[plans,setPlans]=useState([]),[bookings,setBookings]=useState([]),[subs,setSubs]=useState([]);
  const[td,setTd]=useState(null);const toast=(m,t)=>setTd({msg:m,type:t,key:Date.now()});const sw=v=>{setView(v);setVk(k=>k+1)};

  useEffect(()=>{try{const t=localStorage.getItem('aq_token'),u=localStorage.getItem('aq_user');if(t&&u){api.token=t;setUser(JSON.parse(u))}}catch(e){localStorage.removeItem('aq_token');localStorage.removeItem('aq_user')}},[]);

  const fS=useCallback(async()=>{const s=new Date();s.setDate(s.getDate()-7);const e=new Date();e.setDate(e.getDate()+21);const r=await api.get('/api/slots?start='+s.toISOString().split('T')[0]+'&end='+e.toISOString().split('T')[0]);if(r.ok)setSlots(r.slots)},[]);
  const fB=useCallback(async()=>{const r=await api.get('/api/my-bookings');if(r.ok)setBookings(r.bookings)},[]);
  const fSu=useCallback(async()=>{const r=await api.get('/api/my-subscriptions');if(r.ok)setSubs(r.subscriptions)},[]);
  const ref=useCallback(()=>{fS();fB();fSu()},[fS,fB,fSu]);

  useEffect(()=>{if(!user)return;api.get('/api/plans').then(r=>{if(r.ok)setPlans(r.plans)});ref();
    let es;try{es=new EventSource('/api/events');es.addEventListener('update',()=>fS());es.addEventListener('payment_validated',()=>{fSu();toast('Abonnement activé !','success')})}catch(e){}
    const iv=setInterval(fS,20000);return()=>{if(es)es.close();clearInterval(iv)}},[user,ref,fS,fSu]);

  const book=async id=>{const r=await api.post('/api/book',{slot_id:id});if(r.ok){toast('Réservé ! Code: '+r.booking_code,'success');ref();return true}else{toast(r.error||'Erreur','error');fS();return false}};
  const cancel=async id=>{const r=await api.post('/api/cancel',{booking_id:id});if(r.ok){toast('Annulée.','success');ref();return true}else{toast(r.error||'Erreur','error');return false}};
  const logout=()=>{try{localStorage.removeItem('aq_token');localStorage.removeItem('aq_user')}catch(e){}api.token=null;setUser(null)};

  if(!user)return<AuthScreen onAuth={u=>setUser(u)}/>;
  const isAdm=user.role==='admin';
  return(<div className="app">
    <div className="hdr"><div className="hdr-logo"><div className="hdr-icon">A</div><div><h1>Aquabike Evolution</h1><p>Réservation en ligne</p></div></div></div>
    <div className="page"><PW k={vk}>
      {view==='reserve'&&<ReserveView slots={slots} myBookings={bookings} onBook={book} onCancel={cancel} toast={toast} isAdmin={isAdm}/>}
      {view==='calendar'&&<CalView slots={slots} onBook={book} onCancel={cancel} myBookings={bookings} isAdmin={isAdm}/>}
      {view==='plans'&&<PlansV plans={plans} onDone={()=>{fSu();sw('account')}} toast={toast}/>}
      {view==='seances'&&<SeancesV bookings={bookings} onCancel={ref} toast={toast}/>}
      {view==='account'&&<AccountV user={user} subs={subs} toast={toast} onLogout={logout}/>}
      {view==='admin'&&<AdminV user={user} toast={toast}/>}
    </PW></div>
    <div className="bnav">
      <button className={view==='reserve'?'active':''} onPointerUp={()=>sw('reserve')}><span className="icon">➕</span>Réserver</button>
      <button className={view==='calendar'?'active':''} onPointerUp={()=>sw('calendar')}><span className="icon">📅</span>Calendrier</button>
      <button className={view==='plans'?'active':''} onPointerUp={()=>sw('plans')}><span className="icon">💎</span>Formules</button>
      <button className={view==='seances'?'active':''} onPointerUp={()=>sw('seances')}><span className="icon">🎫</span>Séances</button>
      <button className={view==='account'?'active':''} onPointerUp={()=>sw('account')}><span className="icon">👤</span>Compte</button>
      {isAdm&&<button className={view==='admin'?'active':''} onPointerUp={()=>sw('admin')}><span className="icon">⚙️</span>Admin</button>}
    </div>
    {td&&<Toast key={td.key} msg={td.msg} type={td.type} onDone={()=>setTd(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
