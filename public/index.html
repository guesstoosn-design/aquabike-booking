<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050B18">
<title>Aquabike Evolution Dakar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#050B18;--bg2:#0A1628;--bg3:#0F1D32;--card:#111F38;--border:#1A2D4D;--accent:#00D4AA;--accent2:#00B4D8;--accentDim:rgba(0,212,170,.1);--danger:#FF5757;--dangerDim:rgba(255,87,87,.1);--warn:#FFB830;--warnDim:rgba(255,184,48,.1);--text:#EDF2F7;--muted:#8899B0;--dim:#4A5B73;--glass:rgba(15,29,50,.85)}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Outfit',sans-serif;font-weight:700;line-height:1.2}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select{font-family:inherit;outline:none}
#root{height:100%;display:flex;flex-direction:column}
.app{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 90px;-webkit-overflow-scrolling:touch}.page::-webkit-scrollbar{display:none}
.hdr{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-weight:800;font-size:15px;color:#000}
.hdr h1{font-size:13px;font-weight:700}.hdr p{font-size:9px;color:var(--muted)}
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:2px 4px;padding-bottom:max(2px,env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;background:none;color:var(--dim);font-size:9px;font-weight:600;border-radius:8px}
.bnav button.active{color:var(--accent)}.bnav .icon{font-size:17px;line-height:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;transition:all .12s}
.btn-primary{background:linear-gradient(135deg,var(--accent),#00B89C);color:#000;box-shadow:0 4px 16px rgba(0,212,170,.2)}
.btn-primary:active{transform:scale(.97)}
.btn-danger{background:var(--dangerDim);color:var(--danger);border:1px solid rgba(255,87,87,.2)}
.btn-outline{background:transparent;color:var(--accent);border:1px solid rgba(0,212,170,.25)}
.btn-wave{background:linear-gradient(135deg,#1DC3F5,#1BA0D8);color:#fff}
.btn-om{background:linear-gradient(135deg,#FF6B00,#E55D00);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px;width:auto;display:inline-block;border-radius:8px}
.btn-validate{background:var(--accentDim);color:var(--accent);border:1px solid rgba(0,212,170,.25);padding:10px 18px;font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.5px}
.input-group input,.input-group select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px}
.input-group input:focus{border-color:var(--accent)}
.act-tabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}.act-tabs::-webkit-scrollbar{display:none}
.act-tab{padding:7px 12px;border-radius:18px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--bg3);color:var(--muted);border:1px solid var(--border);flex-shrink:0;touch-action:manipulation}
.act-tab.active{background:var(--accentDim);color:var(--accent);border-color:rgba(0,212,170,.3)}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.week-nav button{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:7px 10px;border-radius:8px;font-size:11px;font-weight:600;touch-action:manipulation}
.week-label{font-size:13px;font-weight:700;font-family:'Outfit'}
.cal-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}.cal-wrap::-webkit-scrollbar{display:none}
.cal{display:grid;gap:2px}
.day-head{text-align:center;padding:4px 0;border-radius:6px}.day-head.today{background:rgba(0,180,216,.1)}
.day-head .dow{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:1px}
.day-head .dn{font-size:16px;font-weight:800;font-family:'Outfit'}.day-head.today .dn{color:var(--accent2)}
.slot-hour{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--dim);font-family:'Outfit'}
.slot{border-radius:8px;padding:8px 2px;text-align:center;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;position:relative}
.slot .cnt{font-size:14px;font-weight:700;font-family:'Outfit'}.slot .lbl{font-size:9px;font-weight:600;opacity:.85;margin-top:1px}
.slot.avail{background:rgba(0,212,170,.07);color:var(--accent);border-color:rgba(0,212,170,.15)}
.slot.limited{background:var(--warnDim);color:var(--warn);border-color:rgba(255,184,48,.15)}
.slot.full{background:var(--dangerDim);color:var(--danger);border-color:rgba(255,87,87,.1)}
.slot.mine{background:var(--accentDim);color:var(--accent);border-color:var(--accent)}
.slot.past{background:rgba(10,22,40,.5);color:var(--dim);opacity:.3}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg2);border-top-left-radius:22px;border-top-right-radius:22px;padding:20px 18px 32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:32px;height:4px;border-radius:2px;background:var(--dim);margin:0 auto 14px}
.cap-bar{height:5px;border-radius:3px;background:var(--bg);overflow:hidden;margin:6px 0 14px}
.cap-fill{height:100%;border-radius:3px;transition:width .3s}
.plan{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;touch-action:manipulation}
.plan.selected{border-color:var(--accent);background:rgba(0,212,170,.04)}
.plan-price{font-size:20px;font-weight:800;font-family:'Outfit';color:var(--accent)}
.plan-name{font-size:14px;font-weight:700;margin-top:3px}
.plan-desc{font-size:11px;color:var(--muted);margin-top:2px}
.plan-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-top:4px}
.brow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:6px}
.brow.cancelled{opacity:.4}
.brow-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brow-info{flex:1}.brow-info h4{font-size:13px;font-weight:700;font-family:'Outfit'}.brow-info p{font-size:11px;color:var(--muted);margin-top:1px}
.brow-code{font-family:'Outfit';font-size:10px;color:var(--accent2);background:rgba(0,180,216,.1);padding:2px 7px;border-radius:5px;display:inline-block;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);text-align:center}
.stat-val{font-size:22px;font-weight:800;font-family:'Outfit'}.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.sub-card{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.badge-ok{background:rgba(0,212,170,.12);color:var(--accent)}.badge-pending{background:var(--warnDim);color:var(--warn)}.badge-expired{background:var(--dangerDim);color:var(--danger)}
.sub-dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}.sub-dot{width:18px;height:5px;border-radius:3px;background:var(--border)}.sub-dot.used{background:var(--accent)}
.pending-card{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--warn);margin-bottom:8px}
.section-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin:16px 0 8px}
.part-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}.part-row:last-child{border:none}
.toast{position:fixed;top:14px;left:14px;right:14px;z-index:100;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;animation:fadeD .25s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-ok{background:rgba(0,212,170,.15);color:var(--accent);border:1px solid rgba(0,212,170,.3)}
.toast-err{background:var(--dangerDim);color:var(--danger);border:1px solid rgba(255,87,87,.3)}
@keyframes fadeD{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:32px 16px;color:var(--dim)}.empty .em{font-size:36px;margin-bottom:8px}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;font-family:'Outfit';color:#000;margin:0 auto 12px}
.profile-info{text-align:center;margin-bottom:16px}.profile-info h2{font-size:18px}.profile-info p{font-size:12px;color:var(--muted);margin-top:2px}
@media(min-width:600px){.page{max-width:480px;margin:0 auto}.bnav{max-width:480px;margin:0 auto;border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useCallback,useMemo}=React;
const DAYS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MF=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const fmtD=d=>`${DAYS[d.getDay()]} ${d.getDate()} ${MF[d.getMonth()].slice(0,3)}`;
const fmtP=n=>n.toLocaleString('fr-FR')+'F';
const fmtDate=s=>fmtD(new Date(s+'T00:00:00'));

const api={token:null,
  async get(u){const r=await fetch(u,{headers:this.token?{Authorization:'Bearer '+this.token}:{}});return r.json()},
  async post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json',...(this.token?{Authorization:'Bearer '+this.token}:{})},body:JSON.stringify(b)});return r.json()}};

function getWD(off){const n=new Date();n.setDate(n.getDate()+off*7);const d=n.getDay();const m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1));const a=[];for(let i=0;i<7;i++){const x=new Date(m);x.setDate(m.getDate()+i);a.push(x)}return a}

function Toast({msg,type,onDone}){useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t)},[]);return<div className={`toast toast-${type==='success'?'ok':'err'}`}>{msg}</div>}

/* ── AUTH ─────────────────────────────────────── */
function AuthScreen({onAuth}){
  const[mode,setMode]=useState('login');const[phone,setPhone]=useState('');const[pin,setPin]=useState('');const[name,setName]=useState('');const[email,setEmail]=useState('');
  const[err,setErr]=useState('');const[ld,setLd]=useState(false);
  const go=async()=>{setErr('');setLd(true);const r=mode==='login'?await api.post('/api/login',{phone,pin}):await api.post('/api/register',{full_name:name,phone,pin,email});setLd(false);
    if(r.ok){api.token=r.token;localStorage.setItem('aq_token',r.token);localStorage.setItem('aq_user',JSON.stringify(r.user));onAuth(r.user)}else setErr(r.error||'Erreur')};
  return(<div style={{minHeight:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',padding:'36px 18px',background:'linear-gradient(160deg,#050B18,#0A1628 40%,#0D2137)'}}>
    <div style={{textAlign:'center',marginBottom:24}}>
      <div style={{width:50,height:50,borderRadius:14,background:'linear-gradient(135deg,#00D4AA,#00B4D8)',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:22,fontWeight:800,color:'#000',fontFamily:'Outfit',marginBottom:8}}>A</div>
      <h1 style={{fontSize:20}}>Aquabike Evolution</h1><p style={{color:'var(--muted)',fontSize:12,marginTop:2}}>Dakar — Réservation en ligne</p></div>
    <div className="card">
      <div style={{display:'flex',gap:4,marginBottom:12}}>
        <button onClick={()=>setMode('login')} className={`btn-sm ${mode==='login'?'btn-primary':'btn-outline'}`} style={{flex:1}}>Connexion</button>
        <button onClick={()=>setMode('register')} className={`btn-sm ${mode==='register'?'btn-primary':'btn-outline'}`} style={{flex:1}}>Inscription</button></div>
      {mode==='register'&&<><div className="input-group"><label>NOM COMPLET</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Fatou Diallo"/></div>
      <div className="input-group"><label>EMAIL (optionnel)</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="fatou@email.com"/></div></>}
      <div className="input-group"><label>TÉLÉPHONE</label><input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="77 123 45 67"/></div>
      <div className="input-group"><label>MOT DE PASSE</label><input type="password" value={pin} onChange={e=>setPin(e.target.value)} placeholder="Votre mot de passe" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
      {err&&<p style={{color:'var(--danger)',fontSize:12,marginBottom:8,textAlign:'center'}}>{err}</p>}
      <button className="btn btn-primary" onClick={go} disabled={ld}>{ld?'...':mode==='login'?'Se connecter':'Créer mon compte'}</button></div></div>);
}

/* ── SLOT MODAL ──────────────────────────────── */
function SlotModal({slot,myBookings,onClose,onBook,onCancel}){
  const[ld,setLd]=useState(false);const[parts,setParts]=useState(null);
  const rem=parseInt(slot.remaining);const bk=parseInt(slot.booked||0);const d=new Date(slot.date_slot+'T00:00:00');
  const myB=(myBookings||[]).find(b=>b.status===1&&b.date_slot===slot.date_slot&&String(b.hour_start)===String(slot.hour_start)&&b.activity===slot.activity);
  useEffect(()=>{api.get('/api/slot/'+slot.id+'/participants').then(r=>{if(r.ok)setParts(r.participants)}).catch(()=>{})},[slot.id]);
  const st=new Date(slot.date_slot+'T'+String(slot.hour_start).padStart(2,'0')+':00:00');const isPast=st<new Date();const canC=myB&&!isPast&&(st-new Date())>=7200000;
  return(<div className="modal-bg" onPointerUp={e=>{if(e.target===e.currentTarget)onClose()}}><div className="modal">
    <div className="modal-handle"/>
    <p style={{fontSize:10,fontWeight:600,color:'var(--muted)',letterSpacing:1}}>{slot.activity?.toUpperCase()}</p>
    <h2 style={{fontSize:18,marginTop:2,fontFamily:'Outfit'}}>{fmtD(d)} — {slot.hour_start}h00</h2>
    <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--muted)',marginTop:10,marginBottom:4}}>
      <span>Places disponibles</span><span style={{fontWeight:700,color:rem<=0?'var(--danger)':rem<=3?'var(--warn)':'var(--accent)'}}>{rem} / {slot.max_capacity}</span></div>
    <div className="cap-bar"><div className="cap-fill" style={{width:`${(bk/slot.max_capacity)*100}%`,background:rem<=2?'var(--danger)':rem<=4?'var(--warn)':'var(--accent)'}}/></div>
    {parts&&parts.filter(p=>p.status===1).length>0&&<div style={{marginBottom:14}}>
      <p style={{fontSize:11,fontWeight:600,color:'var(--muted)',marginBottom:6}}>PARTICIPANTS ({parts.filter(p=>p.status===1).length})</p>
      {parts.filter(p=>p.status===1).map(p=><div key={p.id} className="part-row"><span>{p.full_name}</span></div>)}</div>}
    {isPast?<div className="btn" style={{background:'var(--bg3)',color:'var(--dim)'}}>Créneau passé</div>
    :myB?<><div style={{background:'var(--accentDim)',border:'1px solid rgba(0,212,170,.2)',borderRadius:12,padding:12,textAlign:'center',marginBottom:10}}>
      <span style={{color:'var(--accent)',fontWeight:700,fontSize:13}}>✓ Vous avez réservé</span><br/><span style={{fontSize:11,color:'var(--muted)'}}>Code : {myB.booking_code}</span></div>
      {canC?<button className="btn btn-danger" onPointerUp={async()=>{setLd(true);await onCancel(myB.id);setLd(false)}} disabled={ld}>{ld?'...':'Annuler ma réservation'}</button>
      :<p style={{textAlign:'center',fontSize:12,color:'var(--dim)'}}>🔒 Annulation impossible (&lt;2h)</p>}</>
    :rem<=0?<div className="btn" style={{background:'var(--dangerDim)',color:'var(--danger)'}}>Créneau complet</div>
    :<button className="btn btn-primary" onPointerUp={async()=>{setLd(true);await onBook(slot.id);setLd(false)}} disabled={ld}>{ld?'...':'Réserver (1 séance débitée)'}</button>}
    <p style={{fontSize:10,color:'var(--dim)',textAlign:'center',marginTop:8}}>Annulation possible jusqu'à 2h avant</p>
  </div></div>);
}

/* ── CALENDAR ────────────────────────────────── */
function CalendarView({slots,onBook,onCancel,myBookings}){
  const[wo,setWo]=useState(0);const[act,setAct]=useState('Aquabike');const[modal,setModal]=useState(null);
  const days=useMemo(()=>getWD(wo),[wo]);const td=new Date().toISOString().split('T')[0];
  const isRN=act==='Rééducation'||act==='Natation';
  const hours=useMemo(()=>isRN?[13,14,15,16]:[8,9,10,11,12,17,18,19],[isRN]);
  const sm=useMemo(()=>{const m={};(slots||[]).filter(s=>s.activity===act).forEach(s=>{m[s.date_slot+'_'+s.hour_start]=s});return m},[slots,act]);
  const myMap=useMemo(()=>{const m={};(myBookings||[]).filter(b=>b.status===1).forEach(b=>{m[b.date_slot+'_'+b.hour_start+'_'+b.activity]=b});return m},[myBookings]);

  const openSlot=(s)=>{if(s)setModal({...s})};

  return(<div>
    <div className="act-tabs">{['Aquabike','Aquagym','Rééducation','Natation'].map(a=><button key={a} className={'act-tab'+(act===a?' active':'')} onPointerUp={()=>setAct(a)}>{a==='Rééducation'?'Rééduc.':a}</button>)}</div>
    <div className="week-nav"><button onPointerUp={()=>setWo(w=>w-1)}>◂ Préc.</button><span className="week-label">{MF[days[0].getMonth()].toUpperCase()} {days[0].getFullYear()}</span><button onPointerUp={()=>setWo(w=>w+1)}>Suiv. ▸</button></div>
    <div className="cal-wrap"><div className="cal" style={{gridTemplateColumns:'42px repeat(7,1fr)',minWidth:isRN?360:500}}>
      <div/>{days.map((d,i)=>{const iso=d.toISOString().split('T')[0];return<div key={i} className={'day-head'+(iso===td?' today':'')}><div className="dow">{DAYS[d.getDay()]}</div><div className="dn">{d.getDate()}</div></div>})}
      {hours.map(h=><React.Fragment key={h}><div className="slot-hour">{String(h).padStart(2,'0')}h</div>
        {days.map((d,i)=>{const ds=d.toISOString().split('T')[0];const dow=d.getDay();const isWE=dow===0||dow===6;
          let valid=true;if(!isRN){if(isWE&&(h<10||h>12))valid=false;if(!isWE&&h>=13&&h<17)valid=false}
          const k=ds+'_'+h;const s=sm[k];const now=new Date();const st=new Date(ds+'T'+String(h).padStart(2,'0')+':00:00');const isPast=st<now;
          if(!valid||!s)return<div key={k} className="slot past"><span className="cnt" style={{fontSize:10}}>—</span></div>;
          const rem=parseInt(s.remaining);const isMine=!!myMap[ds+'_'+h+'_'+act];
          let cls='slot ';if(isPast)cls+='past';else if(isMine)cls+='mine';else if(rem<=0)cls+='full';else if(rem<=3)cls+='limited';else cls+='avail';
          return<div key={k} className={cls} onPointerUp={()=>{if(!isPast)openSlot(s)}}><span className="cnt">{isPast?'—':isMine?'✓':rem<=0?'✕':rem}</span><span className="lbl">{isPast?'':isMine?'Réservé':rem<=0?'Complet':rem<=3?rem+' pl.':''}</span></div>})}</React.Fragment>)}
    </div></div>
    {modal&&<SlotModal slot={sm[modal.date_slot+'_'+modal.hour_start]||modal} myBookings={myBookings} onClose={()=>setModal(null)}
      onBook={async id=>{const ok=await onBook(id);if(ok)setModal(null);return ok}}
      onCancel={async id=>{const ok=await onCancel(id);if(ok)setModal(null);return ok}}/>}
  </div>);
}

/* ── PLANS ────────────────────────────────────── */
function PlansView({plans,onSubscribe,toast}){
  const[sel,setSel]=useState(null);const[pm,setPm]=useState(false);const[ld,setLd]=useState(false);
  const sub=async m=>{if(!sel)return;setLd(true);const r=await api.post('/api/subscribe',{plan_id:sel.id,payment_method:m});setLd(false);
    if(r.ok){if(r.payment_url)window.open(r.payment_url,'_blank');toast(m==='cash'?'Demande envoyée ! En attente de validation.':'Abonnement activé !','success');setPm(false);setSel(null);onSubscribe()}else toast(r.error||'Erreur','error')};
  return(<div><h2 style={{fontSize:17,marginBottom:3}}>Nos abonnements</h2><p style={{fontSize:11,color:'var(--muted)',marginBottom:12}}>Choisissez votre formule</p>
    {plans.map(p=><div key={p.id} className={'plan'+(sel?.id===p.id?' selected':'')} onPointerUp={()=>{setSel(p);setPm(true)}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}><div><div className="plan-name">{p.name}</div><div className="plan-desc">{p.desc}</div></div><div className="plan-price">{fmtP(p.price)}</div></div>
      <span className="plan-badge" style={{background:p.limit_type==='weekly'?'rgba(0,180,216,.1)':'var(--warnDim)',color:p.limit_type==='weekly'?'var(--accent2)':'var(--warn)'}}>{p.limit_type==='weekly'?p.limit_value+'x/sem':p.limit_value+' séances'} · {p.duration_days}j</span></div>)}
    {pm&&sel&&<div className="modal-bg" onPointerUp={e=>{if(e.target===e.currentTarget)setPm(false)}}><div className="modal">
      <div className="modal-handle"/><h2 style={{fontSize:17,fontFamily:'Outfit',marginBottom:3}}>{sel.name}</h2><p style={{color:'var(--muted)',fontSize:12,marginBottom:3}}>{sel.desc}</p><p className="plan-price" style={{marginBottom:14}}>{fmtP(sel.price)}</p>
      <p style={{fontSize:11,fontWeight:600,color:'var(--muted)',marginBottom:8}}>MODE DE PAIEMENT</p>
      <button className="btn btn-wave" onPointerUp={()=>sub('wave')} disabled={ld} style={{marginBottom:6}}>💳 Wave</button>
      <button className="btn btn-om" onPointerUp={()=>sub('orange_money')} disabled={ld} style={{marginBottom:6}}>📱 Orange Money</button>
      <button className="btn btn-outline" onPointerUp={()=>sub('cash')} disabled={ld}>💵 Espèces (sur place)</button>
      <p style={{fontSize:10,color:'var(--dim)',textAlign:'center',marginTop:8}}>Espèces = validation admin requise</p></div></div>}
  </div>);
}

/* ── MES SÉANCES ─────────────────────────────── */
function SeancesView({bookings,onCancel,toast}){
  const now=new Date();const active=(bookings||[]).filter(b=>b.status===1);const past=(bookings||[]).filter(b=>b.status!==1);
  const cancel=async id=>{if(!confirm('Annuler cette réservation ?'))return;const r=await api.post('/api/cancel',{booking_id:id});if(r.ok){toast('Annulée.','success');onCancel()}else toast(r.error||'Erreur','error')};
  return(<div>
    <h2 style={{fontSize:17,marginBottom:12}}>Mes séances</h2>
    {active.length===0&&past.length===0&&<div className="empty"><div className="em">📅</div>Aucune réservation<br/><span style={{fontSize:11}}>Réservez depuis le calendrier</span></div>}
    {active.map(b=>{const st=new Date(b.date_slot+'T'+String(b.hour_start).padStart(2,'0')+':00:00');const cc=b.status===1&&st>now&&(st-now)>=7200000;
      return<div key={b.id} className="brow"><div className="brow-icon" style={{background:'var(--accentDim)'}}>🏊</div><div className="brow-info"><h4>{fmtDate(b.date_slot)} — {b.hour_start}h</h4><p>{b.activity}</p><span className="brow-code">{b.booking_code}</span></div>
      {cc?<button className="btn-sm btn-danger" onPointerUp={()=>cancel(b.id)}>Annuler</button>:<span style={{fontSize:10,color:'var(--dim)'}}>🔒</span>}</div>})}
    {past.length>0&&<><p className="section-title">HISTORIQUE</p>{past.slice(0,20).map(b=><div key={b.id} className="brow cancelled"><div className="brow-icon" style={{background:'var(--dangerDim)'}}>✕</div><div className="brow-info"><h4>{fmtDate(b.date_slot)} — {b.hour_start}h</h4><p>{b.activity} — Annulée</p></div></div>)}</>}
  </div>);
}

/* ── MON COMPTE ──────────────────────────────── */
function AccountView({user,subs,toast,onLogout,onRefresh}){
  const[tab,setTab]=useState('profile');
  const[curPwd,setCurPwd]=useState('');const[newPwd,setNewPwd]=useState('');const[ld,setLd]=useState(false);
  const[profile,setProfile]=useState(null);
  useEffect(()=>{api.get('/api/me').then(r=>{if(r.ok)setProfile(r.user)})},[]);

  const activeSubs=(subs||[]).filter(s=>s.status==='active');
  const pendingSubs=(subs||[]).filter(s=>s.status==='pending');
  const expiredSubs=(subs||[]).filter(s=>s.status!=='active'&&s.status!=='pending');

  const changePwd=async()=>{if(!curPwd||!newPwd||newPwd.length<4){toast('4 caractères minimum','error');return}
    setLd(true);const r=await api.post('/api/change-password',{current_password:curPwd,new_password:newPwd});setLd(false);
    if(r.ok){toast('Mot de passe modifié !','success');setCurPwd('');setNewPwd('')}else toast(r.error||'Erreur','error')};

  const tabs=[{id:'profile',l:'Profil'},{id:'abos',l:'Abonnements'},{id:'password',l:'Mot de passe'}];

  return(<div>
    <div className="profile-avatar">{(user.full_name||'?')[0].toUpperCase()}</div>
    <div className="profile-info"><h2>{user.full_name}</h2><p>{profile?.phone||user.phone} {profile?.email?'· '+profile.email:''}</p>
      <p style={{fontSize:11,color:'var(--dim)',marginTop:4}}>Membre depuis {profile?new Date(profile.created_at).toLocaleDateString('fr-FR'):''}</p></div>

    <div className="act-tabs" style={{marginBottom:12}}>{tabs.map(t=><button key={t.id} className={'act-tab'+(tab===t.id?' active':'')} onPointerUp={()=>setTab(t.id)}>{t.l}</button>)}</div>

    {tab==='profile'&&<div>
      <div className="card" style={{textAlign:'center'}}>
        <div style={{fontSize:13,color:'var(--muted)',marginBottom:4}}>Votre rôle</div>
        <span className={'badge '+(user.role==='admin'?'badge-ok':'badge-pending')} style={{fontSize:12,padding:'4px 14px'}}>{user.role==='admin'?'Administrateur':'Client'}</span>
      </div>
      <div className="stat-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
        <div className="stat-card"><div className="stat-val" style={{color:'var(--accent)'}}>{activeSubs.length}</div><div className="stat-lbl">Abonnement(s) actif(s)</div></div>
        <div className="stat-card"><div className="stat-val" style={{color:'var(--accent2)'}}>{activeSubs.reduce((a,s)=>a+(s.limit_value-s.sessions_used),0)}</div><div className="stat-lbl">Séances restantes</div></div>
      </div>
      <button className="btn btn-danger" onPointerUp={onLogout} style={{marginTop:12}}>Se déconnecter</button>
    </div>}

    {tab==='abos'&&<div>
      {pendingSubs.length>0&&<><p className="section-title">⏳ EN ATTENTE DE VALIDATION</p>
        {pendingSubs.map(s=><div key={s.id} className="sub-card" style={{borderColor:'var(--warn)'}}><div style={{display:'flex',justifyContent:'space-between'}}><b style={{fontSize:13}}>{s.plan_name}</b><span className="badge badge-pending">En attente</span></div>
          <p style={{fontSize:11,color:'var(--muted)',marginTop:3}}>Paiement {s.payment_method==='cash'?'espèces':'en ligne'}</p></div>)}</>}

      {activeSubs.length>0&&<><p className="section-title">✅ ACTIFS</p>
        {activeSubs.map(s=><div key={s.id} className="sub-card"><div style={{display:'flex',justifyContent:'space-between'}}><b style={{fontSize:13}}>{s.plan_name}</b><span className="badge badge-ok">Actif</span></div>
          <p style={{fontSize:11,color:'var(--muted)',marginTop:2}}>Expire le {new Date(s.expires_at).toLocaleDateString('fr-FR')}</p>
          <div className="sub-dots">{Array.from({length:s.limit_value}).map((_,i)=><div key={i} className={'sub-dot'+(i<s.sessions_used?' used':'')}/>)}</div>
          <p style={{fontSize:10,color:'var(--muted)',marginTop:3}}>{s.sessions_used}/{s.limit_value} séances utilisées · {fmtP(s.price)}</p></div>)}</>}

      {expiredSubs.length>0&&<><p className="section-title">📜 HISTORIQUE</p>
        {expiredSubs.map(s=><div key={s.id} className="sub-card" style={{opacity:.5}}><div style={{display:'flex',justifyContent:'space-between'}}><b style={{fontSize:13}}>{s.plan_name}</b><span className="badge badge-expired">Expiré</span></div>
          <p style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{s.sessions_used}/{s.limit_value} séances · {fmtP(s.price)}</p></div>)}</>}

      {activeSubs.length===0&&pendingSubs.length===0&&expiredSubs.length===0&&<div className="empty"><div className="em">💎</div>Aucun abonnement<br/><span style={{fontSize:11}}>Achetez-en un depuis l'onglet Abonnements</span></div>}
    </div>}

    {tab==='password'&&<div className="card">
      <h3 style={{fontSize:14,marginBottom:12}}>Changer mon mot de passe</h3>
      <div className="input-group"><label>MOT DE PASSE ACTUEL</label><input type="password" value={curPwd} onChange={e=>setCurPwd(e.target.value)} placeholder="Votre mot de passe actuel"/></div>
      <div className="input-group"><label>NOUVEAU MOT DE PASSE</label><input type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} placeholder="Nouveau mot de passe (4+ car.)"/></div>
      <button className="btn btn-primary" onPointerUp={changePwd} disabled={ld}>{ld?'...':'Modifier'}</button>
    </div>}
  </div>);
}

/* ── ADMIN ───────────────────────────────────── */
function AdminView({user,toast}){
  const[data,setData]=useState(null);const[ld,setLd]=useState(false);const[tab,setTab]=useState('overview');
  const[gs,setGs]=useState(new Date().toISOString().split('T')[0]);const[ge,setGe]=useState(new Date(Date.now()+30*86400000).toISOString().split('T')[0]);
  const fd=useCallback(async()=>{const r=await api.get('/api/admin/dashboard');if(r.ok)setData(r)},[]);
  useEffect(()=>{if(user.role==='admin')fd()},[user,fd]);
  const gen=async()=>{setLd(true);const r=await api.post('/api/admin/generate-slots',{date_start:gs,date_end:ge,activities:['Aquabike','Aquagym','Rééducation','Natation']});setLd(false);if(r.ok){toast(r.created+' créneaux !','success');fd()}else toast(r.error||'Erreur','error')};
  const validate=async id=>{const r=await api.post('/api/admin/validate-payment',{subscription_id:id});if(r.ok){toast('Paiement validé !','success');fd()}else toast('Erreur','error')};
  if(user.role!=='admin')return<div className="card" style={{textAlign:'center',padding:20}}><p style={{color:'var(--muted)'}}>Accès admin requis</p></div>;
  if(!data)return<div className="empty"><div className="em">⏳</div>Chargement...</div>;
  return(<div>
    <div className="act-tabs" style={{marginBottom:12}}>{[{id:'overview',l:'Résumé'},{id:'bookings',l:'Réservations'},{id:'subs',l:'Abonnements'},{id:'pending',l:'💵 Espèces ('+data.pending_payments.length+')'},{id:'gen',l:'Créneaux'}].map(t=><button key={t.id} className={'act-tab'+(tab===t.id?' active':'')} onPointerUp={()=>setTab(t.id)}>{t.l}</button>)}</div>

    {tab==='overview'&&<><div className="stat-grid">
      <div className="stat-card"><div className="stat-val" style={{color:'var(--accent2)'}}>{data.stats.total_users}</div><div className="stat-lbl">Inscrits</div></div>
      <div className="stat-card"><div className="stat-val" style={{color:'var(--accent)'}}>{data.stats.active_subscriptions}</div><div className="stat-lbl">Abonnés</div></div>
      <div className="stat-card"><div className="stat-val" style={{color:'var(--warn)'}}>{data.stats.today_bookings}</div><div className="stat-lbl">Résa. today</div></div></div>
      <p className="section-title">CRÉNEAUX AUJOURD'HUI</p>
      {data.today_slots.length===0?<p style={{fontSize:12,color:'var(--dim)'}}>Aucun créneau</p>
      :data.today_slots.map((s,i)=><div key={i} className="brow">
        <div className="brow-icon" style={{background:parseInt(s.remaining)<=0?'var(--dangerDim)':parseInt(s.remaining)<=3?'var(--warnDim)':'var(--accentDim)',fontSize:13,fontWeight:700,fontFamily:'Outfit',color:parseInt(s.remaining)<=0?'var(--danger)':parseInt(s.remaining)<=3?'var(--warn)':'var(--accent)'}}>{s.booked}/{s.max_capacity}</div>
        <div className="brow-info"><h4>{s.hour_start}h — {s.activity}</h4><p>{s.remaining} place(s)</p></div></div>)}</>}

    {tab==='bookings'&&<><p className="section-title">RÉSERVATIONS SEMAINE</p>
      {data.week_bookings.length===0?<p style={{fontSize:12,color:'var(--dim)'}}>Aucune</p>
      :data.week_bookings.filter(b=>b.booking_status===1).map((b,i)=><div key={i} className="brow"><div className="brow-icon" style={{background:'var(--accentDim)'}}>🏊</div>
        <div className="brow-info"><h4>{fmtDate(b.date_slot)} {b.hour_start}h · {b.activity}</h4><p>{b.full_name} — {b.phone}</p><span className="brow-code">{b.booking_code}</span></div></div>)}</>}

    {tab==='subs'&&<><p className="section-title">ABONNEMENTS</p>
      {data.subscriptions.map((s,i)=><div key={i} className="sub-card">
        <div style={{display:'flex',justifyContent:'space-between'}}><div><b style={{fontSize:13}}>{s.full_name}</b><br/><span style={{fontSize:11,color:'var(--muted)'}}>{s.phone}</span></div>
        <span className={'badge badge-'+(s.status==='active'?'ok':s.status==='pending'?'pending':'expired')}>{s.status==='active'?'Actif':s.status==='pending'?'Attente':'Expiré'}</span></div>
        <p style={{fontSize:12,marginTop:4}}>{s.plan_name} — <b>{fmtP(s.price)}</b> · {s.payment_method} · {s.sessions_used}/{s.limit_value}</p></div>)}</>}

    {tab==='pending'&&<><p className="section-title">💵 PAIEMENTS ESPÈCES À VALIDER</p>
      {data.pending_payments.length===0?<div className="empty"><div className="em">✅</div>Aucun paiement en attente</div>
      :data.pending_payments.map(p=><div key={p.id} className="pending-card">
        <div style={{display:'flex',justifyContent:'space-between'}}><div><b style={{fontSize:14}}>{p.full_name}</b><br/><span style={{fontSize:12,color:'var(--muted)'}}>{p.phone}</span></div><span className="badge badge-pending">En attente</span></div>
        <p style={{fontSize:13,marginTop:6}}>{p.plan_name} — <b style={{color:'var(--accent)'}}>{fmtP(p.price)}</b></p>
        <p style={{fontSize:11,color:'var(--muted)',marginTop:2}}>Demandé le {new Date(p.created_at).toLocaleDateString('fr-FR')}</p>
        <button className="btn-validate" onPointerUp={()=>validate(p.id)} style={{marginTop:10}}>✓ Valider et activer</button></div>)}</>}

    {tab==='gen'&&<div className="card"><h3 style={{fontSize:14,marginBottom:10}}>Générer les créneaux</h3>
      <div className="input-group"><label>DÉBUT</label><input type="date" value={gs} onChange={e=>setGs(e.target.value)}/></div>
      <div className="input-group"><label>FIN</label><input type="date" value={ge} onChange={e=>setGe(e.target.value)}/></div>
      <button className="btn btn-primary" onPointerUp={gen} disabled={ld}>{ld?'...':'Générer les créneaux'}</button></div>}
  </div>);
}

/* ── APP ─────────────────────────────────────── */
function App(){
  const[user,setUser]=useState(null);const[view,setView]=useState('calendar');
  const[slots,setSlots]=useState([]);const[plans,setPlans]=useState([]);const[bookings,setBookings]=useState([]);const[subs,setSubs]=useState([]);
  const[td,setTd]=useState(null);const toast=(m,t)=>setTd({msg:m,type:t,key:Date.now()});

  useEffect(()=>{const t=localStorage.getItem('aq_token');const u=localStorage.getItem('aq_user');if(t&&u){api.token=t;setUser(JSON.parse(u))}},[]);

  const fSlots=useCallback(async()=>{const s=new Date();s.setDate(s.getDate()-7);const e=new Date();e.setDate(e.getDate()+21);
    const r=await api.get('/api/slots?start='+s.toISOString().split('T')[0]+'&end='+e.toISOString().split('T')[0]);if(r.ok)setSlots(r.slots)},[]);
  const fBook=useCallback(async()=>{const r=await api.get('/api/my-bookings');if(r.ok)setBookings(r.bookings)},[]);
  const fSubs=useCallback(async()=>{const r=await api.get('/api/my-subscriptions');if(r.ok)setSubs(r.subscriptions)},[]);
  const refresh=useCallback(()=>{fSlots();fBook();fSubs()},[fSlots,fBook,fSubs]);

  useEffect(()=>{if(!user)return;api.get('/api/plans').then(r=>{if(r.ok)setPlans(r.plans)});refresh();
    const es=new EventSource('/api/events');es.addEventListener('update',()=>fSlots());es.addEventListener('payment_validated',()=>{fSubs();toast('Abonnement activé !','success')});
    const iv=setInterval(fSlots,20000);return()=>{es.close();clearInterval(iv)}},[user,refresh,fSlots,fSubs]);

  const book=async id=>{const r=await api.post('/api/book',{slot_id:id});if(r.ok){toast('Réservé ! Code: '+r.booking_code,'success');refresh();return true}else{toast(r.error||'Erreur','error');fSlots();return false}};
  const cancel=async id=>{const r=await api.post('/api/cancel',{booking_id:id});if(r.ok){toast('Annulée.','success');refresh();return true}else{toast(r.error||'Erreur','error');return false}};
  const logout=()=>{localStorage.removeItem('aq_token');localStorage.removeItem('aq_user');api.token=null;setUser(null);setView('calendar')};

  if(!user)return<AuthScreen onAuth={u=>setUser(u)}/>;
  return(<div className="app">
    <div className="hdr"><div className="hdr-logo"><div className="hdr-icon">A</div><div><h1>Aquabike Evolution</h1><p>Réservation en ligne</p></div></div></div>
    <div className="page">
      {view==='calendar'&&<CalendarView slots={slots} onBook={book} onCancel={cancel} myBookings={bookings}/>}
      {view==='plans'&&<PlansView plans={plans} onSubscribe={()=>{fSubs();setView('account')}} toast={toast}/>}
      {view==='seances'&&<SeancesView bookings={bookings} onCancel={refresh} toast={toast}/>}
      {view==='account'&&<AccountView user={user} subs={subs} toast={toast} onLogout={logout} onRefresh={refresh}/>}
      {view==='admin'&&<AdminView user={user} toast={toast}/>}
    </div>
    <div className="bnav">
      <button className={view==='calendar'?'active':''} onPointerUp={()=>setView('calendar')}><span className="icon">📅</span>Calendrier</button>
      <button className={view==='plans'?'active':''} onPointerUp={()=>setView('plans')}><span className="icon">💎</span>Abonnements</button>
      <button className={view==='seances'?'active':''} onPointerUp={()=>setView('seances')}><span className="icon">🎫</span>Séances</button>
      <button className={view==='account'?'active':''} onPointerUp={()=>setView('account')}><span className="icon">👤</span>Compte</button>
      {user.role==='admin'&&<button className={view==='admin'?'active':''} onPointerUp={()=>setView('admin')}><span className="icon">⚙️</span>Admin</button>}
    </div>
    {td&&<Toast key={td.key} msg={td.msg} type={td.type} onDone={()=>setTd(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
