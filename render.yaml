databases:
  - name: aquabike-db
    plan: free
    databaseName: aquabike
    user: aquabike_user
    region: frankfurt

services:
  - type: web
    name: aquabike-booking
    runtime: docker
    region: frankfurt
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aquabike-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ADMIN_CODE
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://booking.aquabike-evolution.com
      - key: WAVE_API_KEY
        sync: false
      - key: OM_MERCHANT_KEY
        sync: false
